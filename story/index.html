<title>ストーリー | いざよいのいざない</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    background-color: #0e0e0e;
    color: #e8e8e8;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;

    margin: 0;

  .story-list li {

  .story-list a {
    display: block;

    color: #e8e8e8;
    text-decoration: none;

  .story-list .title {

  .story-list .desc {

  .story-list .date {
